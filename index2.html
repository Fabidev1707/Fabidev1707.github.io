            <article>
                <header>
                    <h2>What I learned today 24/08/26</h2>
                    <h3>Cómo hacer un combo</h3>
                    <form action="">
                        <label for="comboPais">Pais que deseas visitar:</label>
                        <select name="comboPais" id="comboPais">
                            <optgroup label="Asia">
                                <option value="21">India</option>
                                <option value="54">Japon</option>
                            </optgroup>
                            <optgroup label="Europa">
                                <option value="12">Alemania</option>
                            </optgroup>
                        </select>
                    </form>
                    <h3 style=" color: brown; box-shadow: 5px 5px 5px;">Cómo hacer un listbox</h3>
                    <form action="">
                        <label for="comboPais">Pais que deseas visitar:</label>
                        <br>
                        <select multiple name="comboPais" id="comboPais">
                            <optgroup label="Asia">
                                <option value="21">India</option>
                                <option value="54">Japon</option>
                            </optgroup>
                            <optgroup label="Europa">
                                <option value="12">Alemania</option>
                            </optgroup>
                        </select>
                    </form>
                </header>
            </article>
        </section>
